    <!-- Theme: a saved choice wins, otherwise follow the system. Runs before paint so there is no flash -->
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Critical styles: paint the canvas and the transition curtain before any CSS file loads -->
    <style>
      html {
        --pt-panel: #131417;
        background: #0e0f11;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        --pt-panel: #ebe8e1;
        background: #f5f3ee;
        color-scheme: light;
      }
      .js .pt {
        position: fixed;
        inset: 0;
        z-index: 100;
      }
      .js .pt-panels {
        position: absolute;
        inset: 0;
      }
      .js .pt-panels i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(var(--i) * 20% - 1px);
        width: calc(20% + 2px);
        background: var(--pt-panel);
      }
      html:not(.js) .pt {
        display: none;
      }
      /* Failsafe: if the scripts never run, the curtain still gets out of the way */
      .js:not(.pt-ready) .pt {
        animation: pt-failsafe 0s 4s forwards;
      }
      @keyframes pt-failsafe {
        to {
          visibility: hidden;
        }
      }
    </style>
